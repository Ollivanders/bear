# =============================================================================
# tmux configuration
# =============================================================================

# Set prefix to Ctrl-a (optional, comment out to keep default Ctrl-b)
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 10000
set -g base-index 0              # Start window numbering at 1
setw -g pane-base-index 0        # Start pane numbering at 1
set -g renumber-windows on       # Renumber windows when one is closed
set -g escape-time 10            # Reduce escape key delay
set -g focus-events on           # Enable focus events (useful for Neovim)
set -g mouse on                  # Enable mouse support
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "${TERM}"

# =============================================================================
# Vi Mode
# =============================================================================

setw -g mode-keys vi             # Use vi keys in copy mode
set -g status-keys vi            # Use vi keys in command prompt

# Enter copy mode with prefix + [
# Move with vi hjkl, search with / and ?

# Vi-style copy bindings
bind-key -T copy-mode-vi v       send-keys -X begin-selection
bind-key -T copy-mode-vi V       send-keys -X select-line
bind-key -T copy-mode-vi C-v     send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y       send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Y       send-keys -X copy-end-of-line
bind-key -T copy-mode-vi H       send-keys -X start-of-line
bind-key -T copy-mode-vi L       send-keys -X end-of-line

# Vi-style pane navigation (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vi-style pane resizing (prefix + HJKL)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =============================================================================
# Key Bindings
# =============================================================================

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# New window keeping current path
bind c new-window -c "#{pane_current_path}"

# =============================================================================
# Status Bar
# =============================================================================

set -g status on
set -g status-interval 5
set -g status-position bottom

set -g status-style "fg=#cdd6f4,bg=#1e1e2e"
set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#585b70]│ "
set -g status-left-length 30
set -g status-right "#[fg=#585b70]│ #[fg=#a6e3a1]%H:%M #[fg=#585b70]│ #[fg=#89dceb]%d %b"
set -g status-right-length 40

set -g window-status-format "#[fg=#585b70] #I:#W "
set -g window-status-current-format "#[fg=#89b4fa,bold] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Message / command prompt style
set -g message-style "fg=#1e1e2e,bg=#cba6f7"
set -g message-command-style "fg=#1e1e2e,bg=#89b4fa"
